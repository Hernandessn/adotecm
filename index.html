<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adote CM</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="pagina-vitrine">
    <header class="cabecalho">
      <a href="index.html" class="cabecalho__logo" aria-label="Adote CM - página inicial">
        <img class="cabecalho__imagem" src="./assets/logo-adotecm.png" alt="" width="256" height="255" />
        <span class="cabecalho__nome">Adote CM</span>
      </a>
      <nav class="menu" id="menu-principal" aria-label="Navegação principal">
        <a href="index.html" class="menu__link" aria-current="page">Início</a>
        <a href="#sobre" class="menu__link">Sobre</a>
        <a href="#contato" class="menu__link">Contato</a>
      </nav>
      <a href="#" class="cabecalho__perfil" aria-label="Perfil do usuário">
        <svg class="cabecalho__icone" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="3" />
          <path d="M5.5 19a6.5 6.5 0 0 1 13 0" />
        </svg>
      </a>
      <button class="menu-botao" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-principal">
        <svg class="cabecalho__icone" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M5 8h14M5 12h14M5 16h14" />
        </svg>
      </button>
    </header>

    <main class="vitrine">
<section class="hero">
  <div class="hero__conteudo">
    <h1 class="hero__titulo">
      <svg class="hero__pata" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true" focusable="false">
        <ellipse cx="14" cy="28" rx="7" ry="9" transform="rotate(-20 14 28)" />
        <ellipse cx="26" cy="15" rx="7" ry="10" transform="rotate(-8 26 15)" />
        <ellipse cx="40" cy="15" rx="7" ry="10" transform="rotate(8 40 15)" />
        <ellipse cx="52" cy="28" rx="7" ry="9" transform="rotate(20 52 28)" />
        <path d="M32 31c-9 0-17 8-17 16 0 6 5 9 10 9 3 0 5-1 7-1s4 1 7 1c5 0 10-3 10-9 0-8-8-16-17-16z" />
      </svg>
      Adote um Amigo
    </h1>
    <p class="hero__subtitulo">
      Dê uma nova chance a um pet e ganhe um amigo para a vida toda!
    </p>
  </div>

  <img
    class="hero__ilustracao"
    src="./assets/pets-hero.png"
    alt=""
    width="420"
    height="300"
  />
</section>

      <section class="filtros" aria-label="Filtros da vitrine">
        <input
          class="filtros__busca"
          type="search"
          id="busca-nome"
          placeholder="Buscar por nome..."
          aria-label="Buscar por nome"
          autocomplete="off"
        />

        <select
          class="filtros__select"
          id="filtro-especie"
          aria-label="Filtrar por espécie"
          autocomplete="off"
        >
          <option value="">Todos os animais</option>
          <option value="Cão">Cão</option>
          <option value="Gato">Gato</option>
        </select>

        <select
          class="filtros__select"
          id="filtro-idade"
          aria-label="Filtrar por idade"
          autocomplete="off"
        >
          <option value="">Todas as idades</option>
          <option value="Menos de 6 meses">Menos de 6 meses</option>
          <option value="Mais de 6 meses">Mais de 6 meses</option>
        </select>
      </section>

      <p class="vitrine__aviso" id="aviso-vitrine" hidden></p>
      <button
        class="botao vitrine__tentar"
        id="botao-tentar"
        type="button"
        hidden
      >
        Tentar de novo
      </button>

      <section class="grade" id="grade-animais" aria-live="polite"></section>
    </main>

<footer class="rodape">
  <div class="rodape-conteudo">
    <div class="rodape-slogan">
      <h3>Adote com amor</h3>
      <p>Adoção responsável transforma vidas.</p>
    </div>

    <div class="rodape-marca">
      <img class="rodape-logo" src="./assets/logo-adotecm.png" alt="Logo do Adote CM" width="128" height="128" />
      <p class="rodape-nome">AdoteCM</p>
    </div>

    <div class="rodape-contato">
      <h3>Contato</h3>
      <nav class="rodape-links" aria-label="Contato">
        <a href="mailto:contato@adotecm.org" aria-label="Enviar e-mail para AdoteCM">
          <span class="icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M3 7l9 6 9-6" />
            </svg>
          </span>
          contato@adotecm.org
        </a>
        <a href="https://instagram.com/adotecm" target="_blank" rel="noopener noreferrer" aria-label="Instagram do AdoteCM (abre em nova aba)">
          <span class="icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="0.5" />
            </svg>
          </span>
          @adotecm
        </a>
        <a href="https://wa.me/5500000000000" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp do AdoteCM (abre em nova aba)">
          <span class="icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <path d="M4 20l1.3-4A8 8 0 1 1 8.2 18.8L4 20z" />
              <path d="M9 9c0 3 3 6 6 6l1-1.5-2-1-1 .8c-.8-.4-1.6-1.2-2-2l.8-1-1-2L9 9z" />
            </svg>
          </span>
          (00) 00000-0000
        </a>
      </nav>
    </div>
  </div>

  <div class="rodape-final">
    <p>&copy; AdoteCM &bull; Projeto de extensão</p>
  </div>
</footer>
    <script src="script.js"></script>
  </body>
</html>
