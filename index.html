<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adote CM</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="pagina-vitrine">
    <header class="cabecalho">
      <a href="index.html" class="cabecalho__logo" aria-label="Adote CM - página inicial">
        <img class="cabecalho__imagem" src="./assets/logo-adotecm.png" alt="" width="256" height="255" />
        <span class="cabecalho__nome">Adote CM</span>
      </a>
      <nav class="menu" id="menu-principal" aria-label="Navegação principal">
        <a href="index.html" class="menu__link" aria-current="page">Início</a>
        <a href="#sobre" class="menu__link">Sobre</a>
        <a href="#contato" class="menu__link">Contato</a>
      </nav>
      <a href="#" class="cabecalho__perfil" aria-label="Perfil do usuário">
        <svg class="cabecalho__icone" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="3" />
          <path d="M5.5 19a6.5 6.5 0 0 1 13 0" />
        </svg>
      </a>
      <button class="menu-botao" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-principal">
        <svg class="cabecalho__icone" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M5 8h14M5 12h14M5 16h14" />
        </svg>
      </button>
    </header>

    <main class="vitrine">
      <section class="vitrine__topo">
        <h1 class="vitrine__titulo">Adote um Amigo</h1>
        <p class="vitrine__subtitulo">
          Dê uma nova chance a um pet e ganhe um amigo para a vida toda!
        </p>
      </section>

      <section class="filtros" aria-label="Filtros da vitrine">
        <input
          class="filtros__busca"
          type="search"
          id="busca-nome"
          placeholder="Buscar por nome..."
          aria-label="Buscar por nome"
          autocomplete="off"
        />

        <select
          class="filtros__select"
          id="filtro-especie"
          aria-label="Filtrar por espécie"
          autocomplete="off"
        >
          <option value="">Todos os animais</option>
          <option value="Cão">Cão</option>
          <option value="Gato">Gato</option>
        </select>

        <select
          class="filtros__select"
          id="filtro-idade"
          aria-label="Filtrar por idade"
          autocomplete="off"
        >
          <option value="">Todas as idades</option>
          <option value="Menos de 6 meses">Menos de 6 meses</option>
          <option value="Mais de 6 meses">Mais de 6 meses</option>
        </select>
      </section>

      <p class="vitrine__aviso" id="aviso-vitrine" hidden></p>
      <button
        class="botao vitrine__tentar"
        id="botao-tentar"
        type="button"
        hidden
      >
        Tentar de novo
      </button>

      <section class="grade" id="grade-animais" aria-live="polite"></section>
    </main>

    <footer class="rodape"></footer>

    <script src="script.js"></script>
  </body>
</html>
